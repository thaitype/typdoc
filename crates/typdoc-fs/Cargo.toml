[package]
name = "typdoc-fs"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "File system access for typdoc: the only crate that writes files."

# The only crate that may change a file: `crates/typdoc-core/clippy.toml` refuses the calls
# everywhere else, with no exception, so what may write is settled by which crate a call is in.
[dependencies]
typdoc-core = { version = "0.3.0", path = "../typdoc-core" }

[dev-dependencies]
tempfile = "3.27.0"
typdoc-testkit = { path = "../typdoc-testkit" }
