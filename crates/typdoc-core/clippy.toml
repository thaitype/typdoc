# The environment, the time and every change to a file are reached through `deps` or the `Fs`
# trait, whose methods are not the functions below; the concrete file system is `typdoc-fs`.
# The list has no exception and covers test code too: a test that reaches around the seam stops
# proving anything about the code that ships.
disallowed-methods = [
    { path = "std::env::var", reason = "the environment is reached through Env in deps" },
    { path = "std::env::var_os", reason = "the environment is reached through Env in deps" },
    { path = "std::env::home_dir", reason = "the home directory is reached through Env in deps" },
    { path = "std::process::Command::new", reason = "a process could be spawned to do the writing" },
    { path = "std::time::SystemTime::now", reason = "the time is reached through Clock in deps, so that a stamped time is one a test chose" },
    { path = "chrono::Utc::now", reason = "the time is reached through Clock in deps, so that a stamped time is one a test chose" },
    { path = "chrono::Local::now", reason = "the time is reached through Clock in deps, so that a stamped time is one a test chose" },
    { path = "std::fs::write", reason = "a write goes through the seam" },
    { path = "std::fs::rename", reason = "a write goes through the seam" },
    { path = "std::fs::copy", reason = "a write goes through the seam" },
    { path = "std::fs::remove_file", reason = "a write goes through the seam" },
    { path = "std::fs::remove_dir", reason = "a write goes through the seam" },
    { path = "std::fs::remove_dir_all", reason = "a write goes through the seam" },
    { path = "std::fs::create_dir", reason = "a write goes through the seam" },
    { path = "std::fs::create_dir_all", reason = "a write goes through the seam" },
    { path = "std::fs::hard_link", reason = "a write goes through the seam" },
    { path = "std::fs::set_permissions", reason = "a write goes through the seam" },
    { path = "std::fs::File::create", reason = "a write goes through the seam" },
    { path = "std::fs::File::create_new", reason = "a write goes through the seam" },
    { path = "std::fs::File::set_len", reason = "a write goes through the seam" },
    { path = "std::fs::OpenOptions::open", reason = "a file opened for writing is no call to any other listed function" },
    { path = "std::os::unix::fs::symlink", reason = "a write goes through the seam" },
]
