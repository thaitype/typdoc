[workspace]
resolver = "3"
members = ["crates/typdoc-core", "crates/typdoc-fs", "crates/typdoc", "crates/typdoc-testkit"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/thaitype/typdoc"

# The profile 'dist' (cargo-dist) builds every prebuilt binary with — see dist-workspace.toml.
[profile.dist]
inherits = "release"
lto = "thin"
