# A throwaway probe: measures Windows file and console behaviour on a CI runner. Never merged.
[package]
name = "windows-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }
