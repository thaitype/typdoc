name: pages

# Deploys pages/ (the install one-liner scripts + the root redirect page) to GitHub Pages
# (typdoc.thaitype.dev) via actions/deploy-pages. Pages source is already set to "GitHub
# Actions" and the custom domain + HTTPS enforcement are already configured as repo settings —
# this workflow only needs to produce and publish the deployment, not touch those settings.
#
# Triggers on push to `main`. The full install flow (see .chief/story-5/_goal/goal.md's
# "Full-flow proof") was proven end-to-end against the real custom domain from the story
# branch, through a temporary trigger on this workflow and a temporary allowance in the
# `github-pages` deploy environment's allowed branches, both since removed — that environment
# rule is the one piece still outstanding, a settings change tracked in goal.md's After Merge
# list, not a file this workflow touches.
#
# Path-filtered to pages/ (and to this workflow file itself), mirroring publish-check.yml's
# existing path-filter pattern: `paths:` filters a whole workflow run in GitHub Actions, not a
# single job, so this stays its own workflow rather than a job inside ci.yml.
#
# A merge here is a production deploy per the story brief, so it goes through a normal PR with
# CI like everything else — no separate approval step beyond that.
on:
  push:
    branches:
      - main
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment should ever be in flight at a time; never cancel one that's already
# publishing mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # actions/checkout, actions/upload-pages-artifact and actions/deploy-pages are pinned to
    # their current major versions (v7/v3/v4) as of when this workflow was written, same
    # reasoning as dist-build.yml's v7 pins and publish.yml's v8/v4 pins.
    steps:
      - uses: actions/checkout@v7
      - name: Upload pages/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # This is the actual acceptance check for the live-URL install flow (see
  # .chief/story-5/_contract/contract.md's "CI: live-URL install check" and
  # .chief/story-5/_tickets/05-live-check-workflow-code.md): it runs for real, right after every
  # real deploy above, against the real typdoc.thaitype.dev -- not against a PR's code, and not
  # a rehearsal. A failure here blocks this pages.yml run, genuinely: something the deploy just
  # published doesn't match what's in this repo, or the domain itself is broken.
  #
  # Calls the reusable live-check.yml workflow rather than duplicating its steps here: the same
  # check also runs, independently, from live-check-scheduled.yml's own scheduled job -- same
  # `workflow_call` pattern this repo already uses for dist-build.yml (called from both
  # publish.yml and dist-build-check.yml).
  verify-live:
    name: verify live install URLs
    needs: deploy
    uses: ./.github/workflows/live-check.yml
