name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: scripts/test.sh
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml at the repo root pins the toolchain (1.96.0) and
      # its rustfmt/clippy components. rustup, preinstalled on GitHub-hosted
      # runners (both ubuntu-latest and macos-latest), reads that file and
      # installs the matching toolchain (and components) on first use, so no
      # separate toolchain-install action is needed here.
      - run: rustc --version
      # Proves the memory ceiling itself is enforced on this runner before
      # trusting it for the real run below. On Linux this exercises the
      # existing systemd-run --user --scope path (already known to work from
      # this ticket's earlier, ubuntu-only build). On macOS, `ulimit -v` was
      # tried first and found non-functional on a real runner ("ulimit -v is
      # not settable in this shell") — the cap here is a background watchdog
      # that polls available memory via `vm_stat` and SIGKILLs the whole
      # process group if it drops too far below a freshly-measured baseline
      # (see scripts/test.sh's own header comment for the full history and
      # why raw `vm_stat` "free" alone reads misleadingly low on macOS). This
      # step is where that watchdog's own self-test proves itself on real
      # hardware. A failure here means the cap doesn't work on this OS, not
      # that the suite is broken — worth telling apart if this step is the
      # one that goes red.
      #
      # TMPDIR is set inline, per step, as a plain shell variable read from
      # $RUNNER_TEMP — not through a workflow- or job-level `env:` block.
      # GitHub Actions doesn't resolve the `runner` context there (only
      # `github`/`vars`/`secrets`/`inputs`/`needs`/`strategy`/`matrix` are
      # available in a workflow- or job-level `env:`); a workflow that tries
      # anyway isn't rejected loudly — the whole file silently fails to
      # register under its own `name:` and every job comes up empty (found by
      # bisecting a real failed run, not read from documentation alone: see
      # the story's own build notes). `runner.temp` and `$RUNNER_TEMP` are
      # the same disk-backed, per-job directory on every OS, ubuntu or macOS.
      - run: TMPDIR="$RUNNER_TEMP" scripts/test.sh --self-test
      # The real gate. scripts/test.sh itself now prints how many tests
      # passed and refuses to report success if that count is zero, so a
      # step that silently ran nothing shows up as red here, not as a quiet
      # skip. The ubuntu-latest and macos-latest counts do NOT match by a
      # small, named amount: seven tests that create a file named by raw,
      # non-UTF-8 bytes are `#[cfg_attr(not(target_os = "linux"), ignore =
      # "...")]`, confirmed necessary on a real macos-latest run, 2026-09-24
      # — APFS refuses to create such a filename at all (EILSEQ), where
      # Linux's filesystems allow arbitrary bytes in a name. Those seven show
      # up as "ignored," not silently missing, in the macOS job's own count.
      - run: TMPDIR="$RUNNER_TEMP" scripts/test.sh

  fmt:
    name: cargo fmt --check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - run: cargo fmt --check

  clippy:
    name: cargo clippy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - run: cargo clippy --workspace --all-targets -- -D warnings

  windows-pass-rate:
    name: Windows test-suite pass rate (non-blocking)
    runs-on: windows-latest
    # This job is a measurement, not a gate: it reports how many of the suite's tests
    # currently pass on Windows, it does not require that they all do. It must never turn a
    # PR red — not achieved with job-level `continue-on-error` (that keeps the *workflow*
    # green but still shows the *job's own check* as failed, which reads as red on the PR).
    # Instead, every step here succeeds for either of the two known states (compiled with a
    # measured rate; did not compile) and only scripts/windows_test_report.py's own exit
    # code — non-zero for the one genuinely unknown state, compiled but zero tests counted —
    # can fail this job. This also runs the suite directly with `cargo test`, not through
    # scripts/test.sh: that script's memory ceiling is enforced via systemd-run (Linux) or a
    # vm_stat watchdog (macOS), neither of which exists on Windows, and this job needs no
    # memory cap of its own — just one run of the suite and an honest count of the result.
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup (preinstalled on windows-latest)
      # installs it on first use, same as the ubuntu/macOS jobs above.
      - run: rustc --version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Proves the counting/reporting script itself works — against fixed sample output,
      # independent of any real `cargo test` run — before trusting it with a real one
      # below. Same "prove the mechanism before trusting it" shape as scripts/test.sh's own
      # --self-test step in the `test` job above.
      - name: Self-test the pass-rate reporting logic
        run: |
          python scripts/test_windows_test_report.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # `--no-fail-fast` for the same reason as the `test` job above: one red suite must
      # never hide every suite after it. Output is streamed to the terminal and also
      # captured to a file, so the next step can count what actually ran. This step's own
      # exit code is deliberately never checked: `cargo test` returning non-zero (a failing
      # test, or the build not compiling at all) is a *measured outcome* here, not a step
      # failure — the reporting step below is what decides pass/fail for this job, based on
      # what actually happened, not on this command's raw exit code. `exit 0` at the end is
      # required, not decorative: GitHub Actions' pwsh runner fails a step whenever
      # $LASTEXITCODE is non-zero when the script ends, even with no explicit check for it —
      # confirmed live (this step showed red with no check present at all, `cargo test`'s own
      # exit code alone was enough).
      - name: Run test suite (Windows, no memory cap)
        run: |
          $out = Join-Path $env:RUNNER_TEMP "typdoc-test-windows.txt"
          cargo test --workspace --no-fail-fast --features typdoc/test-stand-in 2>&1 | Tee-Object -FilePath $out
          exit 0
      # scripts/windows_test_report.py distinguishes three states and exits accordingly:
      # compiled with a measured rate (reports it, exit 0); did not compile (reports "does
      # not compile -- 0 tests run" plus a ::warning:: annotation, exit 0 -- a known state,
      # not a failure); compiled but zero tests counted (the one truly unknown/broken state
      # -- reports it as an error, exit 1, the only way this job can fail). `if: always()`
      # runs this even when the step above found failing tests or a build that didn't
      # compile: this job measures what happened, it does not require a clean run to do so.
      - name: Compute and report Windows pass rate
        if: always()
        run: |
          $out = Join-Path $env:RUNNER_TEMP "typdoc-test-windows.txt"
          python scripts/windows_test_report.py $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
