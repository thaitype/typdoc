name: CI

on:
  # A pull request builds its branch; a push to that branch would build it a second time.
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: scripts/test.sh
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml at the repo root pins the toolchain (1.96.0) and
      # its rustfmt/clippy components. rustup, preinstalled on GitHub-hosted
      # runners (both ubuntu-latest and macos-latest), reads that file and
      # installs the matching toolchain (and components) on first use, so no
      # separate toolchain-install action is needed here.
      - run: rustc --version
      # Proves the memory ceiling itself is enforced on this runner before
      # trusting it for the real run below. On Linux this exercises the
      # existing systemd-run --user --scope path (already known to work from
      # this ticket's earlier, ubuntu-only build). On macOS, `ulimit -v` was
      # tried first and found non-functional on a real runner ("ulimit -v is
      # not settable in this shell") — the cap here is a background watchdog
      # that polls available memory via `vm_stat` and SIGKILLs the whole
      # process group if it drops too far below a freshly-measured baseline
      # (see scripts/test.sh's own header comment for the full history and
      # why raw `vm_stat` "free" alone reads misleadingly low on macOS). This
      # step is where that watchdog's own self-test proves itself on real
      # hardware. A failure here means the cap doesn't work on this OS, not
      # that the suite is broken — worth telling apart if this step is the
      # one that goes red.
      #
      # TMPDIR is set inline, per step, as a plain shell variable read from
      # $RUNNER_TEMP — not through a workflow- or job-level `env:` block.
      # GitHub Actions doesn't resolve the `runner` context there (only
      # `github`/`vars`/`secrets`/`inputs`/`needs`/`strategy`/`matrix` are
      # available in a workflow- or job-level `env:`); a workflow that tries
      # anyway isn't rejected loudly — the whole file silently fails to
      # register under its own `name:` and every job comes up empty (found by
      # bisecting a real failed run, not read from documentation alone: see
      # the story's own build notes). `runner.temp` and `$RUNNER_TEMP` are
      # the same disk-backed, per-job directory on every OS, ubuntu or macOS.
      - run: TMPDIR="$RUNNER_TEMP" scripts/test.sh --self-test
      # The real gate. scripts/test.sh itself now prints how many tests
      # passed and refuses to report success if that count is zero, so a
      # step that silently ran nothing shows up as red here, not as a quiet
      # skip. The ubuntu-latest and macos-latest counts do NOT match by a
      # small, named amount: seven tests that create a file named by raw,
      # non-UTF-8 bytes are `#[cfg_attr(not(target_os = "linux"), ignore =
      # "...")]`, confirmed necessary on a real macos-latest run, 2026-09-24
      # — APFS refuses to create such a filename at all (EILSEQ), where
      # Linux's filesystems allow arbitrary bytes in a name. Those seven show
      # up as "ignored," not silently missing, in the macOS job's own count.
      - run: TMPDIR="$RUNNER_TEMP" scripts/test.sh

  fmt:
    name: cargo fmt --check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - run: cargo fmt --check

  skills:
    # skills/ is rendered from templates/skills/ with the version in crates/typdoc/Cargo.toml.
    # This fails when skills/ was edited by hand or not re-rendered after a version bump.
    name: skills/ matches templates/skills/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/test_render_skills.py -v
      - run: python3 scripts/render_skills.py --check

  release-tag-in-main:
    # A release is published from its release branch, which then merges into main with a merge
    # commit, so the newest release tag is always in main's history. If it is not, the release
    # branch was squashed, or it has not merged yet (docs/development.md, Releasing).
    name: newest release tag is in main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -v -e '-' | sort -V | tail -1)
          if [ -z "$tag" ]; then exit 0; fi
          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "$tag is in main's history"
            exit 0
          fi
          echo "::error::$tag is not in main's history. If its release PR has not merged yet, merge it with a merge commit. If it was squashed: git checkout main && git merge -s ours $tag && git push (a merge commit that changes no file)."
          exit 1

  clippy:
    name: cargo clippy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - run: cargo clippy --workspace --all-targets -- -D warnings

  own-projects:
    # The repository holds two typdoc projects of its own: the design documents at the root and the
    # tickets in .chief/. This builds typdoc from the pull request and validates both, so a broken
    # ref or a document that no longer matches its schema fails here.
    name: typdoc validate (repository projects)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - run: cargo build --locked -p typdoc
      - name: validate the project at the repository root
        run: target/debug/typdoc validate
      - name: validate the project in .chief
        working-directory: .chief
        run: ../target/debug/typdoc validate

  windows-build:
    name: Windows build (shipped crates)
    runs-on: windows-latest
    # A gate, unlike the pass-rate job below: the shipped crates must build on Windows, and
    # this job's own check is red when they do not. Tests are not compiled here; how many
    # pass on Windows is the pass-rate job's measurement.
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup (preinstalled on windows-latest)
      # installs it on first use, same as the other jobs.
      - run: rustc --version
      - run: cargo build --locked -p typdoc -p typdoc-core -p typdoc-fs

  windows-test:
    name: Windows tests
    runs-on: windows-latest
    # A gate, like the test job on ubuntu and macOS: any test that fails, or does not compile,
    # turns this job red. Tests that cannot apply on Windows are cfg'd out in the test code with
    # their reason, never skipped here. The suite runs with `cargo test` directly, not through
    # scripts/test.sh, whose memory ceiling (systemd-run on Linux, a vm_stat watchdog on macOS)
    # has no Windows form. scripts/windows_test_report.py still reports the count, and names any
    # test target that did not compile, before the last step decides.
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup (preinstalled on windows-latest)
      # installs it on first use, same as the ubuntu/macOS jobs above.
      - run: rustc --version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Proves the counting/reporting script works against fixed sample output before it is
      # trusted with a real run.
      - name: Self-test the Windows test report
        run: |
          python scripts/test_windows_test_report.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # `--no-fail-fast` so one red suite never hides the suites after it. The exit code is
      # kept for the last step rather than failing here, so that the report below always runs.
      # `exit 0` is required: pwsh fails a step whenever $LASTEXITCODE is non-zero at its end.
      - name: Run the test suite
        run: |
          $out = Join-Path $env:RUNNER_TEMP "typdoc-test-windows.txt"
          cargo test --workspace --no-fail-fast --features typdoc/test-stand-in 2>&1 | Tee-Object -FilePath $out
          "$LASTEXITCODE" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP "typdoc-test-windows.code")
          exit 0
      - name: Report the Windows tests
        if: always()
        run: |
          $out = Join-Path $env:RUNNER_TEMP "typdoc-test-windows.txt"
          python scripts/windows_test_report.py $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fail when any test failed or did not compile
        run: |
          $code = (Get-Content (Join-Path $env:RUNNER_TEMP "typdoc-test-windows.code")).Trim()
          if ($code -ne "0") { Write-Output "cargo test exited $code"; exit 1 }
