name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.3.0). Must match every published crate's Cargo.toml."
        required: true
      dry_run:
        description: "Dry-run only (skip the real cargo publish)"
        required: true
        default: true
        type: boolean

jobs:
  gate:
    name: cargo test + clippy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - run: cargo test
      - run: cargo clippy --workspace --all-targets -- -D warnings

  publish:
    name: cargo publish
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - name: Verify every published crate's version matches the input
        run: |
          for pkg in typdoc-core typdoc-fs typdoc; do
            cargo_version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg pkg "$pkg" '.packages[] | select(.name==$pkg) | .version')
            if [ "$cargo_version" != "${{ inputs.version }}" ]; then
              echo "::error::$pkg Cargo.toml version $cargo_version != input ${{ inputs.version }}"
              exit 1
            fi
          done
      # cargo publish --workspace publishes typdoc-core, typdoc-fs and typdoc in dependency
      # order itself, and skips typdoc-testkit automatically (publish = false) — no manual
      # per-crate ordering needed here.
      - run: cargo publish --workspace --dry-run
      - if: ${{ inputs.dry_run == false }}
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
