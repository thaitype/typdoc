name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.3.0). Must match every published crate's Cargo.toml."
        required: true
      dry_run:
        description: "Dry-run only (skip the real cargo publish)"
        required: true
        default: true
        type: boolean

jobs:
  gate:
    name: cargo test + clippy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml at the repo root pins the toolchain (1.96.0) and
      # its rustfmt/clippy components. rustup, preinstalled on GitHub-hosted
      # runners (both ubuntu-latest and macos-latest), reads that file and
      # installs the matching toolchain (and components) on first use, so no
      # separate toolchain-install action is needed here.
      - run: rustc --version
      # Proves the memory ceiling itself is enforced on this runner before
      # trusting it for the real run below. On Linux this exercises the
      # existing systemd-run --user --scope path (already proven to work on
      # Linux). On macOS, `ulimit -v` was tried first and found non-functional
      # on a real runner ("ulimit -v is not settable in this shell") — the cap
      # here is a background watchdog that polls available memory via
      # `vm_stat` and SIGKILLs the whole process group if it drops too far
      # below a freshly-measured baseline (see scripts/test.sh's own header
      # comment for the full history and why raw `vm_stat` "free" alone reads
      # misleadingly low on macOS). This step is where that watchdog's own
      # self-test proves itself on real hardware. A failure here means the
      # cap doesn't work on this OS, not that the suite is broken — worth
      # telling apart if this step is the one that goes red.
      #
      # TMPDIR is set inline, per step, as a plain shell variable read from
      # $RUNNER_TEMP — not through a workflow- or job-level `env:` block.
      # GitHub Actions doesn't resolve the `runner` context there (only
      # `github`/`vars`/`secrets`/`inputs`/`needs`/`strategy`/`matrix` are
      # available in a workflow- or job-level `env:`); a workflow that tries
      # anyway isn't rejected loudly — the whole file silently fails to
      # register under its own `name:` and every job comes up empty (found by
      # bisecting a real failed run, not read from documentation alone).
      # `runner.temp` and `$RUNNER_TEMP` are the same disk-backed, per-job
      # directory on every OS, ubuntu or macOS.
      - run: TMPDIR="$RUNNER_TEMP" scripts/test.sh --self-test
      # The real gate. scripts/test.sh itself now prints how many tests
      # passed and refuses to report success if that count is zero, so a
      # step that silently ran nothing shows up as red here, not as a quiet
      # skip. The ubuntu-latest and macos-latest counts do NOT match by a
      # small, named amount: seven tests that create a file named by raw,
      # non-UTF-8 bytes are `#[cfg_attr(not(target_os = "linux"), ignore =
      # "...")]`, confirmed necessary on a real macos-latest run, 2026-09-24
      # — APFS refuses to create such a filename at all (EILSEQ), where
      # Linux's filesystems allow arbitrary bytes in a name. Those seven show
      # up as "ignored," not silently missing, in the macOS job's own count.
      - run: TMPDIR="$RUNNER_TEMP" scripts/test.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings

  publish:
    name: cargo publish
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - name: Verify every published crate's version matches the input
        run: |
          for pkg in typdoc-core typdoc-fs typdoc; do
            cargo_version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg pkg "$pkg" '.packages[] | select(.name==$pkg) | .version')
            if [ "$cargo_version" != "${{ inputs.version }}" ]; then
              echo "::error::$pkg Cargo.toml version $cargo_version != input ${{ inputs.version }}"
              exit 1
            fi
          done
      # cargo publish --workspace publishes typdoc-core, typdoc-fs and typdoc in dependency
      # order itself, and skips typdoc-testkit automatically (publish = false) — no manual
      # per-crate ordering needed here.
      - run: cargo publish --workspace --dry-run
      - if: ${{ inputs.dry_run == false }}
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  dist-build:
    name: dist build (5 targets)
    needs: gate
    uses: ./.github/workflows/dist-build.yml

  attest:
    name: attest build provenance
    needs: dist-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      # Pulls every target's archive + checksum back out of the workflow artifacts dist-build.yml
      # (called above) uploaded — attestation runs once, here, over the actual release build; a
      # PR build (dist-build-check.yml) never reaches this job.
      #
      # download-artifact and attest-build-provenance are pinned to their current major versions
      # (v8, v4) as of when this job was written, same reasoning as dist-build.yml's v7 pins —
      # not an attempt to match the existing gate job's older v4 checkout pin.
      - name: Download built archives
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist-artifacts
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist-artifacts/typdoc-*.tar.gz,dist-artifacts/typdoc-*.zip"

  release:
    name: create GitHub release + upload assets
    needs: attest
    # Same gating as the `cargo publish` step above: a dry run builds and attests but must
    # create nothing public. No release, no tag, no uploaded assets on a dry run.
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Pulls the same archives + checksums the attest job just attested, out of the same
      # workflow artifacts dist-build.yml uploaded -- never re-built or re-downloaded from a
      # different source than what was attested.
      - name: Download built archives
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist-artifacts
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # scripts/test_extract_release_notes.py is this script's own self-test, exercised
      # against fixed sample changelog text -- the same "prove the mechanism before trusting
      # it" step the gate job's --self-test and the Windows pass-rate job's self-test already
      # follow in this repo, run once here before the real extraction below.
      - name: Self-test the CHANGELOG extraction logic
        run: python scripts/test_extract_release_notes.py -v
      # Generates the release body from CHANGELOG.md's own entry for this version, instead of
      # a hand-written body (how v0.1.0/v0.2.0/v0.3.0 were each done) -- see
      # scripts/extract_release_notes.py's header for why (the two can never drift apart).
      - name: Extract release notes from CHANGELOG.md
        run: |
          python scripts/extract_release_notes.py CHANGELOG.md "${{ inputs.version }}" \
            > "$RUNNER_TEMP/release-notes.md"
      # Creates the tag and the release together, pointed at the commit this workflow ran
      # against, only if a release for this tag doesn't already exist -- re-running this job
      # (e.g. after the upload step below failed) must not error out trying to recreate it.
      - name: Create GitHub release if it doesn't already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ inputs.version }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it as-is."
          else
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "$tag" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
      # --clobber lets a re-run overwrite a partial upload from a previous failed attempt
      # instead of erroring on an asset that's already there.
      - name: Upload archives + checksums as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ inputs.version }}"
          gh release upload "$tag" dist-artifacts/typdoc-* \
            --repo "${{ github.repository }}" \
            --clobber
