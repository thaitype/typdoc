name: publish

# Throwaway proof of the publish gate's Windows leg: the gate job exactly as publish.yml has it,
# run on this pull request, without the preflight and without any job that publishes.
on:
  pull_request:

jobs:
  gate:
    name: cargo test + clippy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml at the repo root pins the toolchain (1.96.0) and
      # its rustfmt/clippy components. rustup, preinstalled on GitHub-hosted
      # runners (ubuntu-latest, macos-latest and windows-latest), reads that file and
      # installs the matching toolchain (and components) on first use, so no
      # separate toolchain-install action is needed here.
      - run: rustc --version
      # Proves the memory ceiling itself is enforced on this runner before
      # trusting it for the real run below. On Linux this exercises the
      # existing systemd-run --user --scope path (already proven to work on
      # Linux). On macOS, `ulimit -v` was tried first and found non-functional
      # on a real runner ("ulimit -v is not settable in this shell") — the cap
      # here is a background watchdog that polls available memory via
      # `vm_stat` and SIGKILLs the whole process group if it drops too far
      # below a freshly-measured baseline (see scripts/test.sh's own header
      # comment for the full history and why raw `vm_stat` "free" alone reads
      # misleadingly low on macOS). This step is where that watchdog's own
      # self-test proves itself on real hardware. A failure here means the
      # cap doesn't work on this OS, not that the suite is broken — worth
      # telling apart if this step is the one that goes red.
      #
      # TMPDIR is set inline, per step, as a plain shell variable read from
      # $RUNNER_TEMP — not through a workflow- or job-level `env:` block.
      # GitHub Actions doesn't resolve the `runner` context there (only
      # `github`/`vars`/`secrets`/`inputs`/`needs`/`strategy`/`matrix` are
      # available in a workflow- or job-level `env:`); a workflow that tries
      # anyway isn't rejected loudly — the whole file silently fails to
      # register under its own `name:` and every job comes up empty (found by
      # bisecting a real failed run, not read from documentation alone).
      # `runner.temp` and `$RUNNER_TEMP` are the same disk-backed, per-job
      # directory on every OS, ubuntu or macOS.
      - if: runner.os != 'Windows'
        run: TMPDIR="$RUNNER_TEMP" scripts/test.sh --self-test
      # The real gate. scripts/test.sh itself now prints how many tests
      # passed and refuses to report success if that count is zero, so a
      # step that silently ran nothing shows up as red here, not as a quiet
      # skip. The ubuntu-latest and macos-latest counts do NOT match by a
      # small, named amount: seven tests that create a file named by raw,
      # non-UTF-8 bytes are `#[cfg_attr(not(target_os = "linux"), ignore =
      # "...")]`, confirmed necessary on a real macos-latest run, 2026-09-24
      # — APFS refuses to create such a filename at all (EILSEQ), where
      # Linux's filesystems allow arbitrary bytes in a name. Those seven show
      # up as "ignored," not silently missing, in the macOS job's own count.
      - if: runner.os != 'Windows'
        run: TMPDIR="$RUNNER_TEMP" scripts/test.sh
      # On Windows the suite runs as ci.yml's `Windows tests` job runs it: `cargo test` directly,
      # since scripts/test.sh's memory ceiling has no Windows form, with the count and any test
      # target that did not compile reported before the step that decides.
      - if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - if: runner.os == 'Windows'
        name: Self-test the Windows test report
        run: |
          python scripts/test_windows_test_report.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: runner.os == 'Windows'
        name: Run the test suite
        run: |
          $out = Join-Path $env:RUNNER_TEMP "typdoc-test-windows.txt"
          cargo test --workspace --no-fail-fast --features typdoc/test-stand-in 2>&1 | Tee-Object -FilePath $out
          "$LASTEXITCODE" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP "typdoc-test-windows.code")
          exit 0
      - if: always() && runner.os == 'Windows'
        name: Report the Windows tests
        run: |
          $out = Join-Path $env:RUNNER_TEMP "typdoc-test-windows.txt"
          python scripts/windows_test_report.py $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: runner.os == 'Windows'
        name: Fail when any test failed or did not compile
        run: |
          $code = (Get-Content (Join-Path $env:RUNNER_TEMP "typdoc-test-windows.code")).Trim()
          if ($code -ne "0") { Write-Output "cargo test exited $code"; exit 1 }
      - run: cargo clippy --workspace --all-targets -- -D warnings

