# A throwaway probe: measures Windows file and console behaviour on the runner. Never merged.
name: windows-probe

on:
  pull_request:
    branches: [main]
    paths:
      - "probe/**"
      - ".github/workflows/probe.yml"

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmd /c ver
      - run: fsutil fsinfo volumeinfo $env:RUNNER_TEMP.Substring(0,3)
      - run: cargo run --locked
        working-directory: probe
